# ─────────────────────────────────────────────────────────────────────
# Face Recognition AI — Docker Compose (Production Stack)
# ─────────────────────────────────────────────────────────────────────
# Usage:
#   docker compose up -d                     Start all services
#   docker compose logs -f api               View API logs
#   docker compose exec api alembic upgrade head   Run migrations
# ─────────────────────────────────────────────────────────────────────

version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &restart-policy
  restart: unless-stopped

services:
  # ── Database ──────────────────────────────────────────────────────
  db:
    <<: *restart-policy
    image: postgres:16-alpine
    container_name: faceai-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-faceai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-face_recognition}
    ports:
      - "127.0.0.1:5432:5432"  # Localhost only — not publicly accessible
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-faceai} -d ${POSTGRES_DB:-face_recognition}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ── Redis (temporary state) ───────────────────────────────────────
  redis:
    <<: *restart-policy
    image: redis:7-alpine
    container_name: faceai-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"  # Localhost only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  # ── FastAPI Backend ───────────────────────────────────────────────
  api:
    <<: *restart-policy
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: faceai-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    # ── Read-only root filesystem (hardening) ──────────────────────
    # The root filesystem is mounted read-only to prevent attackers from
    # modifying application code or writing to unexpected locations.
    # Writable paths are explicitly mounted as tmpfs or named volumes.
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=256M
      - /app/attendance:noexec,nosuid,size=64M    # Runtime attendance exports
      - /app/outputs:noexec,nosuid,size=128M       # Runtime processing outputs
    volumes:
      # Mount models directory for model weights (can be pre-downloaded)
      - ./models:/app/models:ro
      # Mount embeddings directory for persistence
      - embeddings_data:/app/embeddings
      # Mount unknown faces directory for persistence
      - unknown_faces_data:/app/unknown_faces
      # Mount logs for debugging
      - logs_data:/app/logs
      # Mount upload directory
      - uploads_data:/app/uploads
      # Mount data directory for SQLite fallback
      - data_data:/app/data
    # Note: config/settings.yaml is NOT writable with read_only: true.
    # Use environment variables (via .env) for configuration changes at runtime.
    environment:
      DB_TYPE: ${DB_TYPE:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgresql://faceai:changeme@db:5432/face_recognition}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-}@redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8501,http://dashboard:8501}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # GPU support (uncomment for GPU inference)
      # NVIDIA_VISIBLE_DEVICES: all
    # Uncomment for GPU access
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging

  # ── Streamlit Dashboard ───────────────────────────────────────────
  dashboard:
    <<: *restart-policy
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: faceai-dashboard
    command: >
      streamlit run dashboard/app.py
      --server.port 8501
      --server.headless true
      --server.enableCORS false
      --server.enableXsrfProtection true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=128M
    environment:
      API_BASE_URL: http://api:8000
      DB_TYPE: ${DB_TYPE:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgresql://faceai:changeme@db:5432/face_recognition}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-}@redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
    volumes:
      - logs_data:/app/logs
      - data_data:/app/data
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  embeddings_data:
  unknown_faces_data:
  logs_data:
  uploads_data:
  data_data:
