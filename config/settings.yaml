# Face Recognition AI — Settings
# Edit this file to configure the system without touching Python code.

camera:
  # Source type: webcam | android_usb | android_wifi | iphone_usb | iphone_wifi
  source_type: webcam
  id: 0
  # URL for phone cameras (IP Webcam, DroidCam, EpocCam)
  url: "http://192.168.1.100:8080/video"
  width: 640
  height: 480
  fps: 30
  auto_connect: false

recognition:
  yolo_confidence: 0.5
  # FAISS L2 distance threshold (lower = stricter, higher = more tolerant)
  #   0.0-0.5  → Exact duplicate (identical image)
  #   0.5-1.0  → Same person, similar conditions
  #   1.0-1.5  → Same person, different lighting/angle  ← Default range
  #   1.5-2.0  → Possibly different person
  #   > 2.0    → Almost certainly different person
  recognition_threshold: 1.0
  frame_skip: 2                     # Process every Nth frame
  cooldown_seconds: 60              # Don't re-mark attendance within this window

database:
  type: sqlite                      # sqlite | postgresql
  path: data/face_recognition.db

enrollment:
  min_face_size: 100                # Minimum face pixel width for enrollment
  capture_count: 1                  # Number of face captures per enrollment

unknown_faces:
  retention_days: 30                # Auto-delete unknown faces older than this (0 = never)

logging:
  level: INFO                       # DEBUG | INFO | WARNING | ERROR
  file: logs/app.log
  max_size_mb: 10
  backup_count: 3
