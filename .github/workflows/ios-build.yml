name: Apple iOS Build CI

on:
  push:
    branches: [master, main, cross-platform-ci]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "ios/**"
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-linux-validation:
    name: Swift 5.9 Linux CI & SPM Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Swift 5.9
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"

      - name: Verify Swift Toolchain
        run: swift --version

      - name: Build Swift Package
        working-directory: ios/FaceRecognitionAttendance
        run: |
          swift package clean
          swift build -c release

      - name: Run Swift Package Unit Tests
        working-directory: ios/FaceRecognitionAttendance
        run: |
          swift test

  ios-macos-build:
    name: macOS / Xcode iOS Build
    runs-on: macos-14
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version || true
          swift --version

      - name: Build Swift Package (Host / Release)
        working-directory: ios/FaceRecognitionAttendance
        run: |
          swift package clean
          swift build -c release

      - name: Run Swift Package Unit Tests
        working-directory: ios/FaceRecognitionAttendance
        run: |
          swift test --enable-code-coverage

      - name: Verify iOS Target Build (xcodebuild)
        working-directory: ios/FaceRecognitionAttendance
        run: |
          xcodebuild -scheme FaceRecognitionAttendance \
            -destination "generic/platform=iOS" \
            build CODE_SIGNING_ALLOWED=NO || true
