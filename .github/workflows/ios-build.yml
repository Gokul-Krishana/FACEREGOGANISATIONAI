name: Apple iOS Build CI

on:
  push:
    branches: [master, main, cross-platform-ci]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "ios/**"
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  swift-linux-validation:
    name: Swift 5.9 Linux CI & SPM Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Swift 5.9
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"

      - name: Verify Swift Toolchain
        run: swift --version

      - name: Build Swift Package
        working-directory: ios/FaceRecognitionAttendance
        run: |
          swift package clean
          swift build -c release

      - name: Run Swift Package Unit Tests
        working-directory: ios/FaceRecognitionAttendance
        run: |
          swift test

  ios-macos-build:
    name: macOS / Xcode Native iOS & Simulator Build
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16 Version
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version

      - name: Discover & Assert Compatible iPhone Simulator
        run: |
          echo "Scanning available iOS Simulators..."
          xcrun simctl list devices available
          
          SIM_NAME=$(xcrun simctl list devices available | grep -E 'iPhone 16|iPhone 15|iPhone 14|iPhone 13' | head -n 1 | sed -E 's/^[[:space:]]+//; s/[[:space:]]+\(.*\)$//')
          if [ -z "$SIM_NAME" ]; then
            echo "::error::No compatible iPhone simulator found on runner!"
            exit 1
          fi
          echo "Selected Simulator Name: '$SIM_NAME'"
          echo "SIM_NAME=$SIM_NAME" >> $GITHUB_ENV
          
          SIM_UDID=$(xcrun simctl list devices available | grep -E 'iPhone 16|iPhone 15|iPhone 14|iPhone 13' | head -n 1 | grep -o -E '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          if [ -z "$SIM_UDID" ]; then
            echo "::error::Could not extract UDID for simulator '$SIM_NAME'!"
            exit 1
          fi
          echo "Selected Simulator UDID: $SIM_UDID"
          echo "SIM_UDID=$SIM_UDID" >> $GITHUB_ENV

      - name: Boot iOS Simulator & Await Mandatory Boot Readiness
        run: |
          echo "Booting simulator: $SIM_UDID ($SIM_NAME)..."
          xcrun simctl bootstatus "$SIM_UDID" -b
          echo "Simulator boot confirmed ready:"
          xcrun simctl list devices | grep "$SIM_UDID"

      - name: Build Swift Package (macOS Release)
        working-directory: ios/FaceRecognitionAttendance
        run: |
          swift package clean
          swift build -c release

      - name: Run Swift Package Unit Tests (macOS)
        working-directory: ios/FaceRecognitionAttendance
        run: |
          swift test

      - name: Build Native iOS App Target (Xcode)
        working-directory: ios/FaceRecognitionAttendance
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build_logs"
          echo "Listing Xcode Projects and Schemes:"
          xcodebuild -list
          
          xcodebuild build \
            -project FaceRecognitionAttendance.xcodeproj \
            -scheme FaceRecognitionAttendance \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$GITHUB_WORKSPACE/build_logs/xcode_build.log"

      - name: Verify Native App Bundle & Info.plist
        working-directory: ios/FaceRecognitionAttendance
        run: |
          APP_PATH=$(find ./build -name "FaceRecognitionAttendance.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::FaceRecognitionAttendance.app bundle not found in ./build!"
            exit 1
          fi
          echo "Found compiled App bundle at: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          
          PLIST_PATH="$APP_PATH/Info.plist"
          if [ ! -f "$PLIST_PATH" ]; then
            echo "::error::Info.plist missing inside $APP_PATH!"
            exit 1
          fi
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST_PATH")
          echo "Verified Bundle ID: $BUNDLE_ID"
          if [ "$BUNDLE_ID" != "com.facerecognition.attendance" ]; then
            echo "::error::Unexpected bundle ID: $BUNDLE_ID"
            exit 1
          fi
          
          CAM_PERM=$(/usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST_PATH")
          echo "Verified Camera Permission description: $CAM_PERM"
          if [ -z "$CAM_PERM" ]; then
            echo "::error::NSCameraUsageDescription missing from Info.plist!"
            exit 1
          fi

      - name: Install Application on iOS Simulator
        working-directory: ios/FaceRecognitionAttendance
        run: |
          APP_PATH=$(find ./build -name "FaceRecognitionAttendance.app" -type d | head -n 1)
          echo "Installing application bundle $APP_PATH onto simulator $SIM_UDID..."
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          echo "Application installation completed without errors."

      - name: Launch Application & Assert Active Process
        run: |
          mkdir -p "$GITHUB_WORKSPACE/simulator_logs"
          echo "Launching com.facerecognition.attendance on simulator $SIM_UDID..."
          APP_LAUNCH_OUTPUT=$(xcrun simctl launch "$SIM_UDID" com.facerecognition.attendance 2>&1 | tee "$GITHUB_WORKSPACE/simulator_logs/app_launch.log")
          echo "Launch command output: $APP_LAUNCH_OUTPUT"
          
          sleep 4
          echo "Inspecting simulator process table..."
          PROC_LIST=$(xcrun simctl spawn "$SIM_UDID" ps aux | tee "$GITHUB_WORKSPACE/simulator_logs/ps_aux.log")
          echo "Filtered process entries:"
          echo "$PROC_LIST" | grep -E "FaceRecognitionAttendance|com\.facerecognition\.attendance" || true
          
          if ! echo "$PROC_LIST" | grep -E "FaceRecognitionAttendance|com\.facerecognition\.attendance" >/dev/null; then
            LCTL_LIST=$(xcrun simctl spawn "$SIM_UDID" launchctl list | tee "$GITHUB_WORKSPACE/simulator_logs/launchctl.log")
            if ! echo "$LCTL_LIST" | grep -i "facerecognition" >/dev/null; then
              echo "::error::Process com.facerecognition.attendance is not actively running in simulator!"
              exit 1
            fi
          fi
          echo "Confirmed: Application process is actively running in the iOS Simulator!"

      - name: Capture Simulator Diagnostic Logs & Clean Termination
        run: |
          echo "Capturing diagnostic logs from simulator..."
          xcrun simctl spawn "$SIM_UDID" log show --predicate 'process == "FaceRecognitionAttendance" || subsystem == "com.facerecognition.attendance"' --last 2m > "$GITHUB_WORKSPACE/simulator_logs/simctl_system_log.txt" 2>&1 || true
          
          echo "Terminating application com.facerecognition.attendance cleanly..."
          xcrun simctl terminate "$SIM_UDID" com.facerecognition.attendance
          echo "Application terminated cleanly."

      - name: Run Unit Tests on iOS Simulator
        working-directory: ios/FaceRecognitionAttendance
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test_results"
          echo "Running unit tests on iOS Simulator: '$SIM_NAME'"
          xcodebuild test \
            -scheme FaceRecognitionAttendance \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -derivedDataPath ./build \
            -resultBundlePath "$GITHUB_WORKSPACE/test_results/FaceRecognitionAttendanceTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$GITHUB_WORKSPACE/test_results/xcode_test.log"

      - name: Upload Test Results and Simulator Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-test-results-and-logs
          path: |
            build_logs/
            simulator_logs/
            test_results/
          if-no-files-found: ignore

      - name: Shutdown iOS Simulator & Cleanup
        if: always()
        run: |
          if [ -n "$SIM_UDID" ]; then
            echo "Shutting down simulator: $SIM_UDID"
            xcrun simctl shutdown "$SIM_UDID" || true
          fi
          echo "Simulator cleanup complete."
