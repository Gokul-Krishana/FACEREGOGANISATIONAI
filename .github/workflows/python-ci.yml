# ─────────────────────────────────────────────────────────────────────
# Python CI — Backend Tests, Quality & Security
# ─────────────────────────────────────────────────────────────────────
# Runs on every push and pull request to main/develop.
#
# Jobs:
#   1. lint       — ruff check + ruff format
#   2. typecheck  — mypy static type checking
#   3. deps-scan  — pip-audit dependency vulnerability scan
#   4. test       — pytest with coverage (SQLite, no external deps)
#   5. migration  — Verify Alembic migrations run cleanly
# ─────────────────────────────────────────────────────────────────────

name: Python CI

on:
  push:
    branches: [master, main, develop]
    paths-ignore:
      - "frontend/**"
      - "dashboard/**"
      - "*.md"
      - "*.bat"
      - "*.sh"
      - ".dockerignore"
      - "Dockerfile"
      - "docker-compose.yml"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "frontend/**"
      - "dashboard/**"
      - "*.md"

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests use SQLite by default — no PostgreSQL needed in CI
  DB_TYPE: sqlite

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff check
        run: ruff check --output-format=github .

      - name: Run ruff format check
        run: ruff format --check --diff .

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy types-PyYAML types-requests

      - name: Run mypy
        run: |
          mypy app/ --ignore-missing-imports --warn-unused-configs
          mypy services/ --ignore-missing-imports
          mypy database/ --ignore-missing-imports

  deps-scan:
    name: Dependency Scan (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Scan dependencies for vulnerabilities
        continue-on-error: true  # Don't block CI on vulnerabilities, but report them
        run: |
          pip-audit -r requirements.txt --desc on

  migration:
    name: Migration Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install alembic

      - name: Verify schema bootstrap + Alembic migrations (forward + backward)
        # The app's boot path is init_db(): it tries Alembic first and, for fresh
        # databases, falls back to Base.metadata.create_all() then stamps head.
        # So we bootstrap the schema exactly like production, then exercise the
        # migration chain (downgrade -1 / upgrade head) to prove it stays in sync.
        run: |
          mkdir -p data
          python -c "from database.database import init_db; init_db()"
          # Confirm the database is stamped at the latest revision
          alembic current | grep -q "(head)"
          # Round-trip the latest migration to verify it applies cleanly
          alembic downgrade -1
          alembic upgrade head
          alembic current | grep -q "(head)"
          rm -f data/face_recognition.db

  test:
    name: Tests (pytest py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-glx \
            libglib2.0-0 \
            libmagic1 \
            libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --cov=app \
            --cov=services \
            --cov=database \
            --cov-report=term-missing \
            --cov-report=xml \
            -k "not test_blink_cycle_detected"

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
