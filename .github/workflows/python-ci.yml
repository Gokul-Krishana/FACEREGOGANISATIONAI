# ─────────────────────────────────────────────────────────────────────
# Python CI — Backend Tests & Quality
# ─────────────────────────────────────────────────────────────────────
# Runs on every push and pull request to main.
#
# Jobs:
#   1. lint    — ruff check (formatting, import sorting, PEP 8)
#   2. typecheck — mypy static type checking
#   3. test    — pytest with coverage, SQLite (no external deps)
# ─────────────────────────────────────────────────────────────────────

name: Python CI

on:
  push:
    branches: [master, main, develop]
    paths-ignore:
      - "frontend/**"
      - "dashboard/**"
      - "*.md"
      - "*.bat"
      - "*.sh"
      - ".dockerignore"
      - "Dockerfile"
      - "docker-compose.yml"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "frontend/**"
      - "dashboard/**"
      - "*.md"

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Tests use SQLite by default — no PostgreSQL needed in CI
  DB_TYPE: sqlite

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff check
        run: ruff check --output-format=github .

      - name: Run ruff format check
        run: ruff format --check --diff .

  typecheck:
    name: Type Check (mypy)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy types-PyYAML types-requests

      - name: Run mypy
        run: |
          mypy app/ --ignore-missing-imports --warn-unused-configs
          mypy services/ --ignore-missing-imports
          mypy database/ --ignore-missing-imports

  test:
    name: Tests (pytest)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-glx \
            libglib2.0-0 \
            libmagic1 \
            libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Verify database migrations
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/data/test_migrations.db
        run: |
          mkdir -p data
          pip install alembic
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
          rm -f data/test_migrations.db

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --cov=app \
            --cov=services \
            --cov=database \
            --cov-report=term-missing \
            --cov-report=xml \
            -k "not test_blink_cycle_detected" \
            --ignore=tests/test_repository.py  # Known issue: instructor_id schema bug from model migration

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
