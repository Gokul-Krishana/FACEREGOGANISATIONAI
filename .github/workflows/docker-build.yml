# ─────────────────────────────────────────────────────────────────────
# Docker Build — Image Verification
# ─────────────────────────────────────────────────────────────────────
# Builds the Docker image to verify the Dockerfile + dependencies
# compile correctly. This is a BUILD-ONLY check — images are not
# pushed to any registry (that should be done via a separate deploy
# workflow triggered by release tags).
#
# Uses Docker layer caching via GitHub Actions cache to speed up
# repeated builds (the `pip install` layer caches well).
# ─────────────────────────────────────────────────────────────────────

name: Docker Build

on:
  push:
    branches: [master, main]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "api/**"
      - "app/**"
      - "services/**"
      - "database/**"
      - "config/**"
      - "camera/**"
      - "utils/**"
  pull_request:
    branches: [master, main]
    paths:
      - "Dockerfile"
      - "requirements.txt"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read  # Only need to checkout the repo

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-buildx-${{ github.sha }}
          restore-keys: |
            docker-buildx-

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: production
          push: false  # Build only — don't push
          load: true   # Load into local Docker daemon for inspection
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move Docker cache
        run: |
          # Preserve cache layers for next run
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Verify image
        run: |
          # Verify the image was built and contains key files
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-${{ github.sha }} \
            python -c "
import sys
sys.path.insert(0, '/app')
# Verify critical modules can be imported
from api.main import app
print(f'FastAPI app loaded: {app.title}')
from app.deep_liveness import DeepLivenessDetector
print('Deep liveness module available')
from app.amfr_engine import AMFREngine
print('AMFR engine available')
print('image verification passed')
"
